name: Release

# Runs ONLY when a version tag is pushed.
# Examples that trigger it:  v0.1.0  v1.2.3  v2.0.0-beta
# A normal push to main does NOT trigger this.
on:
  push:
    tags:
      - 'v*'

# Required so the workflow can create a GitHub Release.
permissions:
  contents: write

jobs:

  build-macos:
    name: Build macOS Universal
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # tauri.conf.json bundles these models into the app (bundle.resources)
      # so a downloaded .app works standalone. They're gitignored (large
      # binaries), so `tauri build` needs them fetched first — see the
      # script for exactly where they come from.
      - name: Download ASR models
        run: ./scripts/download_models.sh

      - name: Build universal macOS binary
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Verify binary contains both architectures
        run: |
          BINARY=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
                   -name "*" -type f -perm +111 -path "*/Contents/MacOS/*" | head -1)
          echo "Checking: $BINARY"
          lipo -info "$BINARY"
          lipo -info "$BINARY" | grep -q "x86_64" || (echo "MISSING x86_64 slice" && exit 1)
          lipo -info "$BINARY" | grep -q "arm64"  || (echo "MISSING arm64 slice"  && exit 1)
          echo "Universal binary verified."

      # Tauri's own ad-hoc signing step sometimes produces a bundle where
      # the signature claims sealed resources exist but none are recorded
      # ("code has no resources but signature indicates they must be
      # present" — a known, generic macOS bundler quirk, not specific to
      # this project). A plain double-click launch fails against a
      # signature like that. `scripts/install_local.sh` works around this
      # for local dev builds by re-signing the assembled .app in one pass
      # after `tauri build` finishes — this step does the same thing here,
      # so the DMG actually shipped in the GitHub Release doesn't have the
      # bug that only local builds were silently avoiding. The DMG above
      # was already built from the *unsigned-correctly* app, so it has to
      # be rebuilt from the now-properly-signed one — re-signing the .app
      # alone doesn't retroactively fix a DMG already assembled from it.
      - name: Re-sign app and rebuild DMG
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/SpeechX.app"
          DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"

          echo "Re-signing $APP ..."
          signed=false
          for attempt in 1 2 3 4 5; do
            if codesign --force --deep --sign - "$APP"; then
              signed=true
              break
            fi
            echo "codesign attempt $attempt failed (likely a transient lock) — retrying in 2s..."
            sleep 2
          done
          if [ "$signed" != true ]; then
            echo "codesign failed after 5 attempts — not a transient lock, something else is wrong." >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP"

          DMG_PATH=$(find "$DMG_DIR" -name "*.dmg" | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "No .dmg found in $DMG_DIR — expected one from the build step above." >&2
            exit 1
          fi
          DMG_NAME=$(basename "$DMG_PATH")
          echo "Rebuilding $DMG_NAME from the re-signed app ..."
          rm -f "$DMG_PATH"

          STAGING=$(mktemp -d)
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "SpeechX" -srcfolder "$STAGING" -ov -format UDZO "$DMG_DIR/$DMG_NAME"
          rm -rf "$STAGING"

          echo "Done: $DMG_DIR/$DMG_NAME"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows Installers
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Download ASR models
        shell: bash
        run: ./scripts/download_models.sh

      - name: Build Windows installers
        run: npm run tauri build

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    # Waits for BOTH builds. If either fails, no release is published.
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS build
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: ./dist

      - name: Download Windows NSIS installer
        uses: actions/download-artifact@v8
        with:
          name: windows-nsis
          path: ./dist

      - name: Download Windows MSI installer
        uses: actions/download-artifact@v8
        with:
          name: windows-msi
          path: ./dist

      - name: List files being released
        run: ls -lah ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: SpeechX ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## SpeechX ${{ github.ref_name }}

            Offline dictation for macOS and Windows.
            English, Hindi, and Bengali. Fully offline — nothing leaves your machine.

            ### Downloads

            | Platform | File | Supports |
            |---|---|---|
            | macOS | `.dmg` | M1–M5 and Intel, macOS 11+ |
            | Windows | `.exe` | Intel i3–i9 and AMD, Windows 10/11 |

            ### macOS install note
            The app is not yet notarized by Apple. On first launch:
            right-click the app → **Open** → **Open**. macOS remembers after that.

            ### Windows install note
            Some antivirus software flags apps that use global hotkeys.
            This is a known false positive for this category of application.
          files: ./dist/*
