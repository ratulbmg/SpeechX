[package]
name = "speechx"
version = "1.1.0"
description = "SpeechX — offline dictation for macOS"
authors = ["Ratul"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "speechx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `WebviewWindowBuilder::transparent` (used in overlay/panel.rs — the pill
# needs a truly transparent webview, not just a transparent NSWindow) is
# gated behind the `macos-private-api` feature on macOS. We don't declare
# it here: `tauri-nspanel`'s own dependency on `tauri` already enables it,
# and Cargo unifies features across a build, so it's on regardless.
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# M1 — hotkey foundation
rdev = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"

# M2 — audio capture
cpal = "0.15"
ringbuf = "0.5"
hound = "3"

# M3 — ASR
sherpa-onnx = "1.13.5"

# M4 — text injection
enigo = "0.6"

# M6 — language switching
toml = "0.8"
strsim = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# M5 — the pill overlay: a plain WebviewWindowBuilder window still steals
# app focus on macOS. This wraps it as a non-activating NSPanel instead
# (PROMPT.md §10 / hazard #1).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Com",
] }
winreg = "0.52"

# `rdev` 0.5.3 (crates.io's latest, no newer version exists) crashes the
# packaged .app on every keypress on macOS: it unconditionally computes a
# typed-character string for each KeyPress via Carbon/HIToolbox Text Input
# Source Manager calls, which macOS requires run on the main thread — but
# this runs inside our hotkey listener's dedicated background thread
# (necessarily, since `rdev::listen` blocks and our main thread is owned by
# Tauri/AppKit's run loop). SpeechX never reads that string (only the key
# and press/release direction), so `vendor/rdev-0.5.3` is a copy with just
# that unused, crashing computation removed — see its
# `src/macos/common.rs` for the exact patch.
[patch.crates-io]
rdev = { path = "vendor/rdev-0.5.3" }
