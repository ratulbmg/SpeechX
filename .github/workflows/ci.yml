name: CI

# Runs on:
#   - every push to develop
#   - every pull request targeting main or develop
# Does NOT run on tag pushes (release.yml handles those)
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

# If you push twice quickly, cancel the older run instead of
# queueing both. Saves runner minutes and gives faster feedback.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────
  # This job's `name:` value is what appears in the branch
  # protection "required status checks" dropdown.
  # Name shown in GitHub: "Build macOS"
  # ─────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Check Rust formatting
        working-directory: ./src-tauri
        run: cargo fmt --check
        continue-on-error: true   # warn only; do not fail the build on formatting

      - name: Lint Rust
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true   # set to false once the codebase is clippy-clean

      - name: Build macOS app (native arch only — fast)
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: npm run tauri build -- --target aarch64-apple-darwin

  # ─────────────────────────────────────────────────────────
  # Name shown in GitHub: "Build Windows"
  # ─────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run tauri build
